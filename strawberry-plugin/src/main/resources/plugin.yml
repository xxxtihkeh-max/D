name: StrawberrySMP
version: 1.2.0
main: com.strawberrysmp.StrawberrySMP
api-version: '26.3'
author: Strawberry SMP

commands:
  strawberry:
    description: Strawberry SMP main command
    usage: /strawberry
    aliases: [smp]
  help:
    description: Show Strawberry SMP commands
    usage: /help
  ah:
    description: Open the player auction house
    usage: /ah [sell <price>|cancel <listing-id>]
  balance:
    description: Check your Strawberry SMP balance
    usage: /balance
  rules:
    description: Show the Strawberry SMP rules
    usage: /rules
  ip:
    description: Show the Strawberry SMP server address
    usage: /ip
  discord:
    description: Show the Strawberry SMP Discord
    usage: /discord
  spawn:
    description: Teleport to the Strawberry SMP spawn
    usage: /spawn
  setspawn:
    description: Set the Strawberry SMP spawn
    usage: /setspawn
  playtime:
    description: Show your playtime
    usage: /playtime
  ping:
    description: Show your ping
    usage: /ping
  sethome:
    description: Save your home location
    usage: /sethome
  home:
    description: Teleport to your home
    usage: /home
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
  back:
    description: Return to your previous location
    usage: /back
  fly:
    description: Toggle flight (staff only)
    usage: /fly
  vanish:
    description: Toggle vanish (staff only)
    usage: /vanish
  msg:
    description: Send a private message
    usage: /msg <player> <message>
  reply:
    description: Reply to a private message
    usage: /reply <message>

permissions:
  strawberry.admin:
    description: Allows use of Strawberry SMP admin commands
    default: op
